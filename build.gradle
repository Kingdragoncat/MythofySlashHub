plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'com.github.ben-manes.versions' version '0.50.0'
}

group = 'net.mythofy'
version = '1.5.2'
description = 'A simple plugin that adds configurable server commands like /hub.'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'com.velocitypowered:velocity-api:3.1.1'
    annotationProcessor 'com.velocitypowered:velocity-api:3.1.1'
    
    implementation 'com.moandjiezana.toml:toml4j:0.7.2'
    implementation 'org.bstats:bstats-velocity:3.0.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

shadowJar {
    archiveClassifier = ''
    archiveBaseName = project.name
    archiveVersion = project.version
    
    relocate 'com.moandjiezana.toml', 'net.mythofy.mythofySlashHub.libs.toml'
    relocate 'org.bstats', 'net.mythofy.mythofySlashHub.libs.bstats'
    
    minimize {
        exclude(dependency('com.moandjiezana.toml:toml4j:.*'))
        exclude(dependency('org.bstats:bstats-velocity:.*'))
    }
    
    mergeServiceFiles()
    
    from(sourceSets.main.output)
    configurations = [project.configurations.runtimeClasspath]
    
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Built-By': System.getProperty('user.name'),
            'Built-Date': new Date(),
            'Built-JDK': System.getProperty('java.version'),
            'Built-Gradle': gradle.gradleVersion
        )
    }
}

build {
    dependsOn shadowJar
}

jar {
    enabled = false
}

processResources {
    def props = [
        version: version,
        description: description
    ]
    inputs.properties props
    expand props
}

tasks.register('copyToPlugins', Copy) {
    from shadowJar
    into 'plugins'
    doFirst {
        file('plugins').mkdirs()
    }
}

tasks.register('dev') {
    dependsOn shadowJar, copyToPlugins
    description = 'Builds the plugin and copies it to plugins directory for development'
}

tasks.register('release') {
    dependsOn clean, shadowJar
    description = 'Clean build for release'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}